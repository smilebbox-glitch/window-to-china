name: okno-corporate

services:
  china-auto-radar:
    image: okno-v-kitai:${APP_VERSION:-1.7.9-pilot}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-1.7.9-pilot}
      RAG_API_URL: ${RAG_API_URL:-}
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_MODEL: ${RAG_MODEL:-}
      AUTH_MODE: proxy
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?AUTH_PROXY_SECRET is required}
      AUTH_ADMIN_GROUP: ${AUTH_ADMIN_GROUP:-okno-china-admin}
      AUTH_EDITOR_GROUP: ${AUTH_EDITOR_GROUP:-okno-china-editor}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      EXECUTIVE_MIN_ROLE: ${EXECUTIVE_MIN_ROLE:-viewer}
      PILOT_CONTROL_MIN_ROLE: ${PILOT_CONTROL_MIN_ROLE:-admin}
      PILOT_WINDOW_DAYS: ${PILOT_WINDOW_DAYS:-10}
      PILOT_TARGET_MIN_USERS: ${PILOT_TARGET_MIN_USERS:-5}
      PILOT_TARGET_MAX_USERS: ${PILOT_TARGET_MAX_USERS:-10}
      PILOT_MIN_FEEDBACK: ${PILOT_MIN_FEEDBACK:-3}
      PILOT_MIN_USEFUL_PCT: ${PILOT_MIN_USEFUL_PCT:-70}
      PILOT_MIN_REPEAT_PCT: ${PILOT_MIN_REPEAT_PCT:-40}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
      OUTBOUND_ALLOWLIST: ${OUTBOUND_ALLOWLIST:-}
      OUTBOUND_ALLOW_HTTP_HOSTS: ${OUTBOUND_ALLOW_HTTP_HOSTS:-host.docker.internal}
      RUNTIME_CONFIG_PATH: /data/runtime-config.json
      PILOT_DB_PATH: /data/okno.sqlite
      AUDIT_LOG_PATH: /data/audit/audit.jsonl
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?AUDIT_HMAC_KEY is required}
      AUDIT_MAX_BYTES: ${AUDIT_MAX_BYTES:-10485760}
      RATE_LIMIT_READ_PER_MINUTE: ${RATE_LIMIT_READ_PER_MINUTE:-120}
      RATE_LIMIT_EXPENSIVE_PER_MINUTE: ${RATE_LIMIT_EXPENSIVE_PER_MINUTE:-20}
      RATE_LIMIT_ADMIN_MUTATION_PER_5_MIN: ${RATE_LIMIT_ADMIN_MUTATION_PER_5_MIN:-30}
      FX_CACHE_TTL_SECONDS: ${FX_CACHE_TTL_SECONDS:-900}
      FX_CACHE_STALE_SECONDS: ${FX_CACHE_STALE_SECONDS:-86400}
      NEWS_CACHE_TTL_SECONDS: ${NEWS_CACHE_TTL_SECONDS:-300}
      NEWS_CACHE_STALE_SECONDS: ${NEWS_CACHE_STALE_SECONDS:-21600}
      NEWS_SOURCE_CONCURRENCY: ${NEWS_SOURCE_CONCURRENCY:-6}
      NEWS_FETCH_TIMEOUT_MS: ${NEWS_FETCH_TIMEOUT_MS:-9000}
      NEWS_TRANSLATE_TIMEOUT_MS: ${NEWS_TRANSLATE_TIMEOUT_MS:-6500}
      NEWS_SOURCE_DEADLINE_MS: ${NEWS_SOURCE_DEADLINE_MS:-14000}
      NEWS_REQUEST_DEADLINE_MS: ${NEWS_REQUEST_DEADLINE_MS:-32000}
      NEWS_DEDUPE_WINDOW_HOURS: ${NEWS_DEDUPE_WINDOW_HOURS:-72}
      NEWS_MAX_AGE_DAYS: ${NEWS_MAX_AGE_DAYS:-45}
      NEWS_AGGREGATE_LIVE_QUALITY_MIN: ${NEWS_AGGREGATE_LIVE_QUALITY_MIN:-75}
      PILOT_SOURCE_DEGRADED_PCT: ${PILOT_SOURCE_DEGRADED_PCT:-25}
      TRANSLATE_MIN_INTERVAL_MS: ${TRANSLATE_MIN_INTERVAL_MS:-180}
      TRANSLATE_MAX_ATTEMPTS: ${TRANSLATE_MAX_ATTEMPTS:-2}
      SOURCE_HISTORY_RETENTION_DAYS: ${SOURCE_HISTORY_RETENTION_DAYS:-30}
      SOURCE_HISTORY_MAX_ROWS: ${SOURCE_HISTORY_MAX_ROWS:-5000}
      EXPIRED_SNAPSHOT_RETENTION_DAYS: ${EXPIRED_SNAPSHOT_RETENTION_DAYS:-7}
      ARCHIVED_CONTENT_RETENTION_DAYS: ${ARCHIVED_CONTENT_RETENTION_DAYS:-365}
      SCHEDULER_LOCK_TTL_SECONDS: ${SCHEDULER_LOCK_TTL_SECONDS:-120}
      SOURCE_SLA_FX_SECONDS: ${SOURCE_SLA_FX_SECONDS:-1800}
      SOURCE_SLA_FX_MIN_QUALITY: ${SOURCE_SLA_FX_MIN_QUALITY:-60}
      SOURCE_SLA_NEWS_SECONDS: ${SOURCE_SLA_NEWS_SECONDS:-3600}
      SOURCE_SLA_NEWS_MIN_QUALITY: ${SOURCE_SLA_NEWS_MIN_QUALITY:-50}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:?SCHEDULER_TOKEN is required}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-300}
      USER_DATA_HMAC_KEY: ${USER_DATA_HMAC_KEY:?USER_DATA_HMAC_KEY is required}
      USAGE_RETENTION_DAYS: ${USAGE_RETENTION_DAYS:-90}
      INTERNAL_APP_URL: http://127.0.0.1:3000
      WRANGLER_WRITE_LOGS: "false"
      WRANGLER_LOG_PATH: /tmp/wrangler.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - okno-corporate-runtime-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.wrangler:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    cpus: ${APP_CPU_LIMIT:-1.5}
    stop_grace_period: 20s
    labels:
      com.mgc.service: okno-v-kitai
      com.mgc.tier: corporate-sso
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 35s
    networks:
      corporate-edge:

  china-auto-radar-scheduler:
    image: okno-v-kitai:${APP_VERSION:-1.7.9-pilot}
    depends_on:
      china-auto-radar:
        condition: service_healthy
    command: ["node", "scripts/scheduler-client.mjs"]
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-1.7.9-pilot}
      SCHEDULER_APP_URL: http://china-auto-radar:3000
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:?SCHEDULER_TOKEN is required}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-300}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: ${SCHEDULER_MEMORY_LIMIT:-128m}
    cpus: ${SCHEDULER_CPU_LIMIT:-0.25}
    stop_grace_period: 10s
    labels:
      com.mgc.service: okno-v-kitai-scheduler
      com.mgc.tier: corporate-sso
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      corporate-edge:

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    command:
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER_URL:?OIDC_ISSUER_URL is required}
      - --client-id=${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      - --client-secret=${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET:?OAUTH2_PROXY_COOKIE_SECRET is required}
      - --redirect-url=https://${CORPORATE_HOST:?CORPORATE_HOST is required}/oauth2/callback
      - --http-address=0.0.0.0:4180
      - --reverse-proxy=true
      - --trusted-proxy-ip=172.31.179.10/32
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --cookie-secure=true
      - --cookie-samesite=lax
      - --cookie-name=_okno_china_sso
      - --cookie-expire=${SSO_COOKIE_EXPIRE:-8h}
      - --cookie-refresh=${SSO_COOKIE_REFRESH:-15m}
      - --email-domain=*
      - --scope=${OIDC_SCOPE:-openid profile email groups}
      - --oidc-groups-claim=${OIDC_GROUPS_CLAIM:-groups}
      - --allowed-group=${SSO_ALLOWED_GROUP:?SSO_ALLOWED_GROUP is required}
      - --prefer-email-to-user=true
      - --upstream=static://202
      - --whitelist-domain=${CORPORATE_HOST:?CORPORATE_HOST is required}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.5
    networks:
      corporate-edge:

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      china-auto-radar:
        condition: service_healthy
      oauth2-proxy:
        condition: service_started
    ports:
      - "${CORPORATE_BIND_ADDRESS:-0.0.0.0}:${CORPORATE_HTTP_PORT:-80}:8080"
      - "${CORPORATE_BIND_ADDRESS:-0.0.0.0}:${CORPORATE_HTTPS_PORT:-443}:8443"
    environment:
      CORPORATE_HOST: ${CORPORATE_HOST:?CORPORATE_HOST is required}
      AUTH_PROXY_SECRET: ${AUTH_PROXY_SECRET:?AUTH_PROXY_SECRET is required}
      NGINX_ENVSUBST_FILTER: '^(CORPORATE_HOST|AUTH_PROXY_SECRET)$'
    volumes:
      - ./deploy/nginx/corporate.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_FILE:-./deploy/tls/tls.crt}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_FILE:-./deploy/tls/tls.key}:/etc/nginx/tls/tls.key:ro
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=2m
      - /var/cache/nginx:rw,noexec,nosuid,size=8m
      - /var/run:rw,noexec,nosuid,size=1m
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Official nginx still has to create worker-owned runtime files and drop
    # from its root master to the nginx worker user. DAC_READ_SEARCH is the
    # narrow read bypass required for a host-owned TLS private key kept at 0600.
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETGID
      - SETUID
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/oauth2/ping >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      corporate-edge:
        ipv4_address: 172.31.179.10

networks:
  corporate-edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.179.0/24

volumes:
  okno-corporate-runtime-data:

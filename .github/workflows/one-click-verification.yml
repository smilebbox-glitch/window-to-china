name: One-click verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main, feature/v1.7-intelligence-pipeline]
    paths:
      - '.github/workflows/one-click-verification.yml'
      - '.devcontainer/**'
      - '.env.example'
      - '.env.corporate.example'
      - '.gitattributes'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose.corporate.yaml'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'START_CORPORATE_HTTPS.bat'
      - 'STATUS_CORPORATE.bat'
      - 'STOP_CORPORATE.bat'
      - 'start.sh'
      - 'stop.sh'
      - 'status.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-click-verification.yml'
      - '.devcontainer/**'
      - '.env.example'
      - '.env.corporate.example'
      - '.gitattributes'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'compose.corporate.yaml'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'START_CORPORATE_HTTPS.bat'
      - 'STATUS_CORPORATE.bat'
      - 'STOP_CORPORATE.bat'
      - 'start.sh'
      - 'stop.sh'
      - 'status.sh'

permissions:
  contents: read

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm ci
      - name: Run build and automated tests
        run: npm test
      - name: Run current pilot regression gate
        run: npm run test:latest

  build-and-smoke:
    needs: automated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows CRLF security preflight
        run: |
          cp compose.yaml compose.yaml.lf
          trap 'mv compose.yaml.lf compose.yaml' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('compose.yaml')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
          node scripts/pilot-security-preflight.mjs
          mv compose.yaml.lf compose.yaml
          trap - EXIT
      - name: Simulate Windows CRLF Docker build input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-verified.sh')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
      - name: Verify corporate HTTPS and SSO deployment contract
        run: |
          node scripts/corporate-https-sso-preflight.mjs
          mkdir -p .ci-tls
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout .ci-tls/tls.key \
            -out .ci-tls/tls.crt \
            -days 1 \
            -subj '/CN=china-ci.example.internal' \
            -addext 'subjectAltName=DNS:china-ci.example.internal'
          docker run --rm \
            --add-host china-auto-radar:127.0.0.1 \
            --add-host oauth2-proxy:127.0.0.1 \
            -e CORPORATE_HOST=china-ci.example.internal \
            -e AUTH_PROXY_SECRET=ci-proxy-secret \
            -e 'NGINX_ENVSUBST_FILTER=^(CORPORATE_HOST|AUTH_PROXY_SECRET)$' \
            -v "$PWD/deploy/nginx/corporate.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/.ci-tls/tls.crt:/etc/nginx/tls/tls.crt:ro" \
            -v "$PWD/.ci-tls/tls.key:/etc/nginx/tls/tls.key:ro" \
            nginx:1.27-alpine nginx -t
          CORPORATE_HOST=china-ci.example.internal \
          OIDC_ISSUER_URL=https://issuer.example.invalid \
          OIDC_CLIENT_ID=ci-client \
          OIDC_CLIENT_SECRET=ci-client-secret \
          OIDC_SCOPE='openid profile email groups' \
          SSO_ALLOWED_GROUP=okno-china-users \
          OAUTH2_PROXY_COOKIE_SECRET=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
          AUTH_PROXY_SECRET=ci-proxy-secret \
          AUDIT_HMAC_KEY=ci-audit-key \
          SCHEDULER_TOKEN=ci-scheduler-token \
          USER_DATA_HMAC_KEY=ci-user-hmac \
          METRICS_TOKEN=ci-metrics-token \
          TLS_CERT_FILE=./.ci-tls/tls.crt \
          TLS_KEY_FILE=./.ci-tls/tls.key \
          docker compose --env-file /dev/null -f compose.corporate.yaml config > /tmp/okno-corporate-compose.yaml
          grep -q 'oauth2-proxy' /tmp/okno-corporate-compose.yaml
          grep -q 'AUTH_MODE: proxy' /tmp/okno-corporate-compose.yaml
          grep -q 'allowed-group=okno-china-users' /tmp/okno-corporate-compose.yaml
      - name: Start pilot
        run: |
          chmod +x start.sh stop.sh status.sh scripts/*.sh
          NO_BROWSER=1 ./start.sh
      - name: Verify health
        run: |
          curl --fail --show-error http://127.0.0.1:3000/api/health
          curl --fail --show-error http://127.0.0.1:3000/api/ready
      - name: Run automated runtime smoke tests
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run test:runtime
      - name: Verify Web App and PWA runtime assets
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node --test tests/pwa-runtime.mjs
      - name: Show status
        run: ./status.sh
      - name: Diagnostics
        if: always()
        run: docker compose logs --tail=150 || true
      - name: Stop
        if: always()
        run: ./stop.sh || true

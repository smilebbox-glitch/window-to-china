name: One-click verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-click-verification.yml'
      - '.devcontainer/**'
      - '.env.example'
      - '.gitattributes'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'start.sh'
      - 'stop.sh'
      - 'status.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-click-verification.yml'
      - '.devcontainer/**'
      - '.env.example'
      - '.gitattributes'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'start.sh'
      - 'stop.sh'
      - 'status.sh'

permissions:
  contents: read

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm ci
      - name: Run build and automated tests
        run: npm test

  build-and-smoke:
    needs: automated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Windows CRLF security preflight
        run: |
          cp compose.yaml compose.yaml.lf
          trap 'mv compose.yaml.lf compose.yaml' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('compose.yaml')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
          node scripts/pilot-security-preflight.mjs
          mv compose.yaml.lf compose.yaml
          trap - EXIT
      - name: Simulate Windows CRLF Docker build input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-verified.sh')
          text = path.read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
          path.write_bytes(text.replace('\n', '\r\n').encode('utf-8'))
          PY
      - name: Start pilot
        run: |
          chmod +x start.sh stop.sh status.sh scripts/*.sh
          NO_BROWSER=1 ./start.sh
      - name: Verify health
        run: |
          curl --fail --show-error http://127.0.0.1:3000/api/health
          curl --fail --show-error http://127.0.0.1:3000/api/ready
      - name: Run automated runtime smoke tests
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run test:runtime
      - name: Show status
        run: ./status.sh
      - name: Diagnostics
        if: always()
        run: docker compose logs --tail=150 || true
      - name: Stop
        if: always()
        run: ./stop.sh || true

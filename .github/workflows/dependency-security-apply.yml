name: Dependency security apply

on:
  push:
    paths:
      - '.github/workflows/dependency-security-apply.yml'

permissions:
  contents: write

jobs:
  apply-safe-refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pilot hardening branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.7.9-source-reliability-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Refresh patched Next lock
        run: npm install --package-lock-only --save-exact next@16.3.4

      - name: Apply safe production audit fixes
        run: npm audit fix --package-lock-only --omit=dev

      - name: Enforce zero high production vulnerabilities
        run: npm audit --audit-level=high --omit=dev

      - name: Show security dependency result
        run: |
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); console.log('next(package)=',p.dependencies.next); console.log('next(lock)=',l.packages['node_modules/next']?.version); console.log('fast-uri=',l.packages['node_modules/fast-uri']?.version || 'not present');"
          git diff --check

      - name: Commit deterministic lock refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: patch production dependencies for pilot'
          git push origin HEAD:feature/v1.7.9-source-reliability-hardening

name: Server and mobile security gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject tracked secrets and private keys
        run: node scripts/secret-preflight.mjs
      - name: Verify server and mobile security contracts
        run: node --test tests/server-mobile-security.test.mjs
      - name: Verify existing security preflight
        run: npm run pilot:security
      - name: Audit production dependencies for high severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high

name: VM pilot acceptance verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vm-pilot-acceptance-verification.yml'
      - 'scripts/accept-both-vm.sh'
      - 'scripts/accept-both-vm.ps1'
      - 'scripts/write-vm-acceptance-receipt.sh'
      - 'scripts/write-vm-acceptance-receipt.ps1'
      - 'scripts/readiness-both-vm.sh'
      - 'scripts/readiness-both-vm.ps1'
      - 'scripts/ops-report-both-vm.sh'
      - 'scripts/ops-report-both-vm.ps1'
      - 'scripts/backup-both-vm.sh'
      - 'scripts/backup-both-vm.ps1'
      - 'ACCEPT_BOTH_VM.bat'
      - 'READINESS_BOTH_VM.bat'
      - 'OPS_REPORT_BOTH_VM.bat'
      - 'MGC_VM_CONTROL.bat'
      - 'scripts/vm-control.sh'
      - 'scripts/start-both-vm.sh'
      - 'scripts/start-both-vm.ps1'
      - 'scripts/status-both-vm.sh'
      - 'scripts/status-both-vm.ps1'
      - 'scripts/host-firewall-preflight.sh'
      - 'scripts/host-firewall-preflight.ps1'
      - 'tests/vm-pilot-acceptance.test.mjs'
      - 'tests/vm-pilot-readiness.test.mjs'
      - 'tests/dual-vm-operations.test.mjs'
      - '.env.vm.example'
      - 'compose.yaml'
      - 'compose.vm.yaml'

permissions:
  contents: read

jobs:
  acceptance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Okno v Kitai
        uses: actions/checkout@v4
        with:
          path: window-to-china

      - name: Checkout MGC Languages main
        uses: actions/checkout@v4
        with:
          repository: smilebbox-glitch/mgc-languages
          ref: main
          path: mgc-languages

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Verify acceptance, readiness and operations contracts
        working-directory: window-to-china
        run: node --test tests/vm-pilot-acceptance.test.mjs tests/vm-pilot-readiness.test.mjs tests/dual-vm-operations.test.mjs

      - name: Parse Linux operator launchers
        working-directory: window-to-china
        shell: bash
        run: bash -n scripts/accept-both-vm.sh scripts/write-vm-acceptance-receipt.sh scripts/readiness-both-vm.sh scripts/ops-report-both-vm.sh scripts/backup-both-vm.sh scripts/start-both-vm.sh scripts/status-both-vm.sh scripts/host-firewall-preflight.sh scripts/vm-control.sh

      - name: Parse Windows operator launchers
        working-directory: window-to-china
        shell: pwsh
        run: |
          $files = @(
            'scripts/accept-both-vm.ps1',
            'scripts/write-vm-acceptance-receipt.ps1',
            'scripts/readiness-both-vm.ps1',
            'scripts/ops-report-both-vm.ps1',
            'scripts/backup-both-vm.ps1',
            'scripts/start-both-vm.ps1',
            'scripts/status-both-vm.ps1',
            'scripts/host-firewall-preflight.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ('{0}: {1}' -f $file, $_.Message) }
              exit 1
            }
          }

      - name: Start both CPU-only no-AI services
        working-directory: window-to-china
        shell: bash
        env:
          MGC_VM_ALLOWED_CIDR: 10.250.0.0/24
        run: |
          chmod +x ../mgc-languages/scripts/start-vm.sh ../mgc-languages/scripts/entrypoint.sh
          bash scripts/start-both-vm.sh

      - name: Run full pilot acceptance gate
        working-directory: window-to-china
        shell: bash
        env:
          MGC_VM_ALLOWED_CIDR: 10.250.0.0/24
          MGC_VM_ACCEPTANCE_ROOT: ${{ runner.temp }}/mgc-vm-acceptance
        run: bash scripts/accept-both-vm.sh

      - name: Verify acceptance evidence receipt
        working-directory: window-to-china
        shell: bash
        env:
          MGC_VM_ACCEPTANCE_ROOT: ${{ runner.temp }}/mgc-vm-acceptance
        run: |
          RECEIPT_DIR="$(find "$MGC_VM_ACCEPTANCE_ROOT" -mindepth 1 -maxdepth 1 -type d -name '20??????T??????Z' | sort | tail -n1)"
          test -n "$RECEIPT_DIR"
          test -s "$RECEIPT_DIR/acceptance.json"
          test -s "$RECEIPT_DIR/checksums.sha256"
          (cd "$RECEIPT_DIR" && sha256sum -c checksums.sha256)
          node --input-type=module - "$RECEIPT_DIR/acceptance.json" <<'NODE'
          import fs from 'node:fs';
          const file = process.argv[2];
          const receipt = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (receipt.profile !== 'dual-vm-cpu-only-no-ai') process.exit(2);
          if (receipt.result !== 'GO') process.exit(3);
          if (receipt.allowed_cidr !== '10.250.0.0/24') process.exit(4);
          if (JSON.stringify(receipt.ports) !== JSON.stringify([3000, 8080])) process.exit(5);
          for (const key of ['host_firewall','runtime_readiness','ingress_isolation','no_ai_runtime']) {
            if (receipt.checks?.[key] !== 'passed') process.exit(6);
          }
          NODE
          test "$(node -p "JSON.parse(require('fs').readFileSync('$RECEIPT_DIR/acceptance.json','utf8')).okno_commit")" = "$(git rev-parse HEAD)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$RECEIPT_DIR/acceptance.json','utf8')).mgc_languages_commit")" = "$(git -C ../mgc-languages rev-parse HEAD)"
          test -z "$(grep -Ei 'RAG_API_KEY|ADMIN_API_TOKEN|SCHEDULER_TOKEN|POSTGRES_PASSWORD' "$RECEIPT_DIR/acceptance.json" || true)"

      - name: Create verified backup for operations report
        working-directory: window-to-china
        shell: bash
        env:
          MGC_VM_BACKUP_ROOT: ${{ runner.temp }}/mgc-vm-backups
          MGC_VM_BACKUP_RETENTION_DAYS: '14'
        run: |
          bash scripts/backup-both-vm.sh
          BACKUP_DIR="$(find "$MGC_VM_BACKUP_ROOT" -mindepth 1 -maxdepth 1 -type d -name '20??????T??????Z' | sort | tail -n1)"
          test -n "$BACKUP_DIR"
          test -s "$BACKUP_DIR/okno.sqlite"
          test -s "$BACKUP_DIR/mgc_languages.dump"
          test -s "$BACKUP_DIR/manifest.json"
          test -s "$BACKUP_DIR/checksums.sha256"
          (cd "$BACKUP_DIR" && sha256sum -c checksums.sha256)

      - name: Generate and verify final IT operations report
        working-directory: window-to-china
        shell: bash
        env:
          MGC_VM_ALLOWED_CIDR: 10.250.0.0/24
          MGC_VM_ACCEPTANCE_ROOT: ${{ runner.temp }}/mgc-vm-acceptance
          MGC_VM_BACKUP_ROOT: ${{ runner.temp }}/mgc-vm-backups
          MGC_VM_REPORT_ROOT: ${{ runner.temp }}/mgc-vm-reports
          MGC_VM_DISK_WARN_GB: '1'
          MGC_VM_DISK_NO_GO_GB: '0.25'
          MGC_VM_BACKUP_MAX_AGE_HOURS: '24'
        run: |
          bash scripts/ops-report-both-vm.sh | tee operations-report.txt
          REPORT_DIR="$(find "$MGC_VM_REPORT_ROOT" -mindepth 1 -maxdepth 1 -type d -name '20??????T??????Z' | sort | tail -n1)"
          test -n "$REPORT_DIR"
          test -s "$REPORT_DIR/operations.json"
          test -s "$REPORT_DIR/readiness.txt"
          test -s "$REPORT_DIR/checksums.sha256"
          (cd "$REPORT_DIR" && sha256sum -c checksums.sha256)
          node --input-type=module - "$REPORT_DIR/operations.json" <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (report.profile !== 'dual-vm-cpu-only-no-ai') process.exit(2);
          if (report.result !== 'GO') process.exit(3);
          if (report.check_mode !== 'full-readiness') process.exit(4);
          if (report.readiness_exit_code !== 0) process.exit(5);
          if (report.backup_checksum_valid !== true) process.exit(6);
          if (!(report.disk_free_gb > report.disk_no_go_gb)) process.exit(7);
          if (report.backup_age_hours === null || report.backup_age_hours > 24) process.exit(8);
          NODE
          test "$(node -p "JSON.parse(require('fs').readFileSync('$REPORT_DIR/operations.json','utf8')).okno_commit")" = "$(git rev-parse HEAD)"
          test "$(node -p "JSON.parse(require('fs').readFileSync('$REPORT_DIR/operations.json','utf8')).mgc_languages_commit")" = "$(git -C ../mgc-languages rev-parse HEAD)"
          test -z "$(grep -REi 'RAG_API_KEY|ADMIN_API_TOKEN|SCHEDULER_TOKEN|POSTGRES_PASSWORD|OIDC_CLIENT_SECRET' "$REPORT_DIR" || true)"
          grep -q 'OPERATIONS REPORT: HEALTHY' operations-report.txt

      - name: Verify current pilot readiness report
        working-directory: window-to-china
        shell: bash
        env:
          MGC_VM_ALLOWED_CIDR: 10.250.0.0/24
          MGC_VM_ACCEPTANCE_ROOT: ${{ runner.temp }}/mgc-vm-acceptance
          MGC_VM_BACKUP_ROOT: ${{ runner.temp }}/mgc-vm-backups
        run: |
          bash scripts/readiness-both-vm.sh | tee readiness-current.txt
          grep -q 'Acceptance is CURRENT' readiness-current.txt
          grep -q 'Latest backup manifest checksum is valid' readiness-current.txt
          grep -q 'PILOT READINESS: CURRENT ACCEPTANCE / SERVICES READY' readiness-current.txt

      - name: Prove repository drift invalidates acceptance
        working-directory: window-to-china
        shell: bash
        env:
          MGC_VM_ALLOWED_CIDR: 10.250.0.0/24
          MGC_VM_ACCEPTANCE_ROOT: ${{ runner.temp }}/mgc-vm-acceptance
          MGC_VM_BACKUP_ROOT: ${{ runner.temp }}/mgc-vm-backups
        run: |
          git config user.name 'MGC CI Drift Probe'
          git config user.email 'ci-drift-probe@example.invalid'
          git commit --allow-empty -m 'ci: simulate post-acceptance drift' >/dev/null
          if bash scripts/readiness-both-vm.sh > readiness-stale.txt 2>&1; then
            echo '[NO-GO] Readiness unexpectedly accepted a revision that was never admitted.' >&2
            cat readiness-stale.txt
            exit 1
          fi
          grep -q 'ACCEPTANCE STALE' readiness-stale.txt
          grep -q 'PILOT READINESS: ATTENTION REQUIRED' readiness-stale.txt

      - name: Cleanup MGC Languages
        if: always()
        working-directory: mgc-languages
        run: docker compose --env-file .env.vm -f docker-compose.lan.yml -f docker-compose.vm.yml down -v --remove-orphans || true

      - name: Cleanup Okno v Kitai
        if: always()
        working-directory: window-to-china
        run: docker compose --env-file .env.vm -f compose.yaml -f compose.vm.yaml down -v --remove-orphans || true

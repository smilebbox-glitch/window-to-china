<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1d54">
  <title>Окно в Китай — нет соединения</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; background:#f5f9fd; color:#10295b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(180deg,#f7fbff,#edf5fb); }
    main { width:min(560px,100%); border:1px solid #d9e7f2; border-radius:24px; background:white; padding:32px; box-shadow:0 20px 60px rgba(15,39,66,.12); }
    .mark { width:52px; height:52px; border-radius:16px; display:grid; place-items:center; background:#0a1d54; color:white; font-weight:900; font-size:20px; }
    h1 { margin:22px 0 10px; font-size:26px; letter-spacing:-.03em; }
    p { margin:0; color:#637d9e; line-height:1.6; font-size:14px; }
    .note { margin-top:20px; padding:14px 16px; border-radius:14px; background:#f1f7fc; color:#38577d; font-size:13px; }
    a { display:inline-block; margin-top:22px; border-radius:12px; background:#147efb; color:white; padding:12px 18px; font-weight:800; text-decoration:none; }
  </style>
</head>
<body>
  <main>
    <div class="mark">中</div>
    <h1>Нет соединения с «Окном в Китай»</h1>
    <p>Приложение не показывает сохранённые новости или аналитику офлайн, чтобы не выдавать устаревшие данные за актуальные.</p>
    <div class="note">Проверьте корпоративную сеть, VPN или подключение к серверу и повторите попытку.</div>
    <a href="/">Повторить</a>
  </main>
</body>
</html>
